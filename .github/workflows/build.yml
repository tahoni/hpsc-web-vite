name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Lint, build, test and audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN_READ: ${{ secrets.NPM_TOKEN_READ }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Inlined into the bundle at build time (the venue map and Contact Us captcha need them)
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_RECAPTCHA_V2_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V2_SITE_KEY }}
          # Not sensitive; configured as a repository variable (Settings > Actions > Variables), not a secret
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Test
        run: npm run test:run
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_RECAPTCHA_V2_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V2_SITE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Audit dependencies (advisory only)
        run: npm audit
        continue-on-error: true
